[package]
name = "ffc-prototype"
version = "0.1.0"
edition = "2024"
default-run = "ffc-prototype"
autobins = false

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "ffc-prototype"
path = "src/main.rs"

[[bin]]
name = "afc-dedicated"
path = "src/bin/afc-dedicated.rs"

[[bin]]
name = "afc-multiplayer-profile"
path = "src/bin/afc-multiplayer-profile.rs"
required-features = ["perf-alloc"]

[[bin]]
name = "afc-determinism-probe"
path = "src/bin/afc-determinism-probe.rs"

[[bin]]
name = "afc-web-server"
path = "src/bin/afc-web-server.rs"
required-features = ["web-server"]

[features]
default = ["native", "dev-hot-reload"]
native = [
    "bevy/bevy_gilrs",
    "bevy/wayland",
]
dev-hot-reload = ["native", "bevy/file_watcher"]
web = ["bevy/webgl2", "bevy/bevy_gilrs"]
perf = ["dep:libc"]
# Allocation counters replace the process allocator and therefore stay out of
# ordinary graphical timing/RSS captures. The render-free multiplayer profiler
# explicitly opts into this feature.
perf-alloc = ["perf"]
bot-quality = []
trace = ["perf", "bevy/trace_tracy"]
native-net = ["dep:crossbeam-channel", "dep:lightyear"]
steam-net = ["native-net", "dep:steamworks"]
web-server = [
    "dep:axum",
    "dep:base64",
    "dep:futures-util",
    "dep:hmac",
    "dep:sha2",
    "dep:tokio",
    "dep:tower",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:unicode-normalization",
    "dep:unicode-segmentation",
    "dep:wtransport",
    "dep:zeroize",
]
# Compile-time opt-in for private debug builds that use Valve's shared
# Spacewar App ID. build.rs rejects this feature outside guarded App ID 480
# development builds, so it cannot be carried into a shipping client.
spacewar-dev = []
shipping = ["native", "steam-net"]

[dependencies]
arrayvec = "0.7"
bevy = { version = "=0.18.1", default-features = false, features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_asset",
    "bevy_animation",
    "bevy_audio",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "bevy_gltf",
    "bevy_log",
    "bevy_picking",
    "bevy_state",
    "bevy_winit",
    # `bevy_winit` is shared by graphical and headless library builds. Linux
    # still requires one compiled event-loop backend even when a binary never
    # creates a window, so keep X11 at the dependency boundary for every role.
    # Winit's target cfg keeps these dependencies out of browser WASM builds.
    "x11",
    "default_font",
    "reflect_auto_register",
    "serialize",
    "2d_bevy_render",
    "3d_bevy_render",
    "ui_api",
    "ui_bevy_render",
    "scene",
    "gamepad",
    "keyboard",
    "mouse",
    "gltf_animation",
    "png",
    "mp3",
    "vorbis",
    "wav",
] }
getrandom = { version = "0.3.4", features = ["wasm_js"] }
ron = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libm = { version = "=0.2.16", default-features = false, features = ["force-soft-floats"] }
libc = { version = "0.2", optional = true }
crossbeam-channel = { version = "0.5", optional = true }
lightyear = { version = "=0.26.4", default-features = false, optional = true, features = [
    "std",
    "client",
    "server",
    "udp",
    "netcode",
    "crossbeam",
] }
steamworks = { version = "=0.12.2", optional = true, default-features = false }
axum = { version = "=0.8.9", optional = true, features = ["ws"] }
base64 = { version = "=0.22.1", optional = true }
futures-util = { version = "=0.3.32", optional = true, features = ["sink"] }
hmac = { version = "=0.12.1", optional = true }
sha2 = { version = "=0.10.9", optional = true }
tokio = { version = "=1.53.1", optional = true, features = [
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tower = { version = "=0.5.3", optional = true, features = ["util"] }
tracing = { version = "=0.1.44", optional = true }
tracing-subscriber = { version = "=0.3.23", optional = true, features = ["env-filter"] }
unicode-normalization = { version = "=0.1.24", optional = true }
unicode-segmentation = { version = "=1.12.0", optional = true }
wtransport = { version = "=0.7.2", optional = true }
zeroize = { version = "=1.9.0", optional = true }

[dev-dependencies]
tokio-tungstenite = "=0.29.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "AbortController",
    "AbortSignal",
    "BinaryType",
    "Document",
    "Element",
    "Event",
    "Headers",
    "Location",
    "MessageEvent",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Storage",
    "Url",
    "UrlSearchParams",
    "WebSocket",
    "Window",
    "WritableStream",
    "WritableStreamDefaultWriter",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-core-haptics = { version = "0.3.2", default-features = false, features = [
    "std",
    "CHHapticEngine",
    "CHHapticEvent",
    "CHHapticParameter",
    "CHHapticPattern",
    "CHHapticPatternPlayer",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSError",
    "NSString",
] }
objc2-game-controller = { version = "0.3.2", default-features = false, features = [
    "std",
    "GCController",
    "GCDevice",
    "GCPhysicalInputProfile",
    "GCExtendedGamepad",
    "GCControllerElement",
    "GCControllerButtonInput",
    "GCControllerDirectionPad",
    "GCControllerAxisInput",
    "GCDeviceHaptics",
] }

[patch.crates-io]
# Bevy 0.18.1 forgets an owned render-pass diagnostic label every frame.
# Keep this exact-version backport until the upstream guard is fixed.
bevy_render = { path = "vendor/bevy_render" }
# Steamworks 0.12.2 predates Valve's network-identity auth failure in its
# safe callback enum even though the pinned SDK bindings already expose it.
# Keep the dependency version pinned and carry the minimal safe-wrapper fix.
steamworks = { path = "vendor/steamworks" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.profiling]
inherits = "release"
debug = 1
strip = "none"
