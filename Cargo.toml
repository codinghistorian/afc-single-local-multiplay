[package]
name = "ffc-prototype"
version = "0.1.0"
edition = "2024"

[features]
default = ["native"]
native = [
    "bevy/file_watcher",
    "bevy/bevy_gilrs",
    "bevy/x11",
    "bevy/wayland",
]
web = ["bevy/webgl2", "bevy/bevy_gilrs"]
perf = []
trace = ["perf", "bevy/trace_tracy"]

[dependencies]
bevy = { version = "0.18", default-features = false, features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_asset",
    "bevy_animation",
    "bevy_audio",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "bevy_gltf",
    "bevy_log",
    "bevy_picking",
    "bevy_state",
    "bevy_winit",
    "default_font",
    "reflect_auto_register",
    "serialize",
    "2d_bevy_render",
    "3d_bevy_render",
    "ui_api",
    "ui_bevy_render",
    "scene",
    "gamepad",
    "keyboard",
    "mouse",
    "gltf_animation",
    "png",
    "mp3",
    "vorbis",
    "wav",
] }
ron = "0.10"
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Storage", "Window"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-core-haptics = { version = "0.3.2", default-features = false, features = [
    "std",
    "CHHapticEngine",
    "CHHapticEvent",
    "CHHapticParameter",
    "CHHapticPattern",
    "CHHapticPatternPlayer",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSError",
    "NSString",
] }
objc2-game-controller = { version = "0.3.2", default-features = false, features = [
    "std",
    "GCController",
    "GCDevice",
    "GCPhysicalInputProfile",
    "GCExtendedGamepad",
    "GCControllerElement",
    "GCControllerButtonInput",
    "GCControllerDirectionPad",
    "GCControllerAxisInput",
    "GCDeviceHaptics",
] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.profiling]
inherits = "release"
debug = 1
strip = "none"
