name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  release-tool:
    name: Release tool (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Audit clean tracked release source
        if: runner.os == 'Linux'
        run: python scripts/release.py audit-source
      - name: Compile portable release tooling
        run: >-
          python -m py_compile
          scripts/release.py
          scripts/release_lib.py
          scripts/release_self_test.py
      - name: Run synthetic cross-platform packaging tests
        run: python scripts/release.py self-test -v

  native-correctness:
    name: Native correctness
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install native build dependencies
        run: >-
          sudo apt-get update &&
          sudo apt-get install --yes
          libasound2-dev libudev-dev libwayland-dev libx11-dev libxi-dev
          libxkbcommon-dev pkg-config
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check native targets
        run: cargo check --locked --all-targets
      - name: Test native targets
        run: cargo test --locked --all-targets
      - name: Lint native targets
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run render-free dedicated smoke authority
        run: >-
          cargo run --locked --no-default-features
          --bin afc-dedicated --
          --smoke-ticks 6
          --match-id 000102030405060708090a0b0c0d0e0f

  steam-contract:
    name: Steam feature and shipping contract
    runs-on: ubuntu-24.04
    env:
      AFC_BUILD_ID: ci-steam-contract
      AFC_STEAM_APP_ID: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.94.1"
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install native build dependencies
        run: >-
          sudo apt-get update &&
          sudo apt-get install --yes
          libasound2-dev libudev-dev libwayland-dev libx11-dev libxi-dev
          libxkbcommon-dev pkg-config
      - name: Check Steam network targets
        run: >-
          cargo check --locked --no-default-features
          --features native,steam-net --all-targets
      - name: Test Steam network targets
        run: >-
          cargo test --locked --no-default-features
          --features native,steam-net --all-targets
      - name: Lint Steam network targets
        run: >-
          cargo clippy --locked --no-default-features
          --features native,steam-net --all-targets -- -D warnings
      - name: Check exact release shipping feature selection
        run: >-
          cargo check --locked --release --no-default-features
          --features shipping --bin ffc-prototype

  web-build:
    name: Browser distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.94.1"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install WebAssembly tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes binaryen
          cargo install wasm-bindgen-cli --version 0.2.121 --locked
      - name: Build repository-root web_dist
        run: ./scripts/build_web.sh
      - name: Verify browser distribution
        run: |
          test -s web_dist/index.html
          test -s web_dist/pkg/ffc_prototype.js
          test -s web_dist/pkg/ffc_prototype_bg.wasm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: afc-web-dist-${{ github.sha }}
          path: web_dist/
          if-no-files-found: error
          retention-days: 14
