name: Hosted browser authority

on:
  pull_request:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "build.rs"
      - "src/**"
      - "arts/**"
      - "assets/**"
      - "Dockerfile.web-server"
      - ".dockerignore"
      - "deploy/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/audit_dependencies.py"
      - "scripts/build_web.sh"
      - "tests/browser/**"
      - "vendor/steamworks/**"
      - "web/**"
      - ".github/workflows/web-server.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  authority:
    name: API, transports, image, and browser acceptance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.94.1"
          components: rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install Linux build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          binaryen libasound2-dev libx11-dev libxi-dev libxkbcommon-dev pkg-config
      - name: Install matching WebAssembly and browser QA tools
        run: |
          cargo install wasm-bindgen-cli --version 0.2.121 --locked
          npm ci
          npx playwright install --with-deps chromium
      - name: Check formatting and server compilation
        run: |
          cargo fmt --all -- --check
          cargo check --locked --no-default-features \
            --features web-server --bin afc-web-server
      - name: Install dependency audit tool
        run: cargo install cargo-audit --version 0.22.1 --locked
      - name: Audit dependency vulnerabilities
        run: python3 scripts/audit_dependencies.py
      - name: Run hosted API and real transport acceptance
        env:
          RUST_TEST_THREADS: "1"
        run: >-
          cargo test --locked --no-default-features --features web-server
          -- --test-threads=1
      - name: Validate development configuration through the production binary
        env:
          AFC_WEB_DEPLOYMENT: development
          AFC_WEB_HTTP_BIND: 127.0.0.1:0
          AFC_WEB_ALLOWED_ORIGINS: http://127.0.0.1:8000
          AFC_WEB_PUBLIC_WEBSOCKET_URL: ws://127.0.0.1:8080/v2/connect/ws
          AFC_WEB_SIGNING_KEY_ID: "1"
          AFC_WEB_SIGNING_KEY: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE
        run: >-
          cargo run --locked --no-default-features --features web-server
          --bin afc-web-server -- --check-config
      - name: Build the exact browser candidate
        env:
          AFC_BUILD_ID: ci-${{ github.sha }}
        run: ./scripts/build_web.sh
      - name: Build the non-root production image
        run: >-
          docker build --build-arg "AFC_BUILD_ID=ci-${GITHUB_SHA}"
          -f Dockerfile.web-server -t afc-web-server:ci .
      - name: Verify the image embeds the immutable release label
        shell: bash
        run: |
          set -euo pipefail
          identity="$(docker run --rm afc-web-server:ci --release-identity)"
          grep --fixed-strings \
            '"release_label":"ci-${{ github.sha }}"' <<<"$identity"
      - name: Run image and probe health, readiness, config, and metrics
        shell: bash
        run: |
          set -euo pipefail
          name="afc-web-server-ci-${GITHUB_RUN_ID}"
          cleanup() { docker rm --force "$name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --detach --name "$name" \
            --read-only --tmpfs /tmp:size=16m,mode=1777 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --publish 127.0.0.1:18080:8080 \
            --env AFC_WEB_DEPLOYMENT=development \
            --env AFC_WEB_HTTP_BIND=0.0.0.0:8080 \
            --env AFC_WEB_ALLOWED_ORIGINS=http://127.0.0.1:8000 \
            --env AFC_WEB_PUBLIC_WEBSOCKET_URL=ws://127.0.0.1:18080/v2/connect/ws \
            --env AFC_WEB_SIGNING_KEY_ID=1 \
            --env AFC_WEB_SIGNING_KEY=AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE \
            afc-web-server:ci
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/readyz >/dev/null; then
              break
            fi
            sleep 1
          done
          test "$(docker exec "$name" id -u)" = "10001"
          curl --fail --silent http://127.0.0.1:18080/healthz
          curl --fail --silent http://127.0.0.1:18080/readyz
          curl --fail --silent \
            --header 'Origin: http://127.0.0.1:8000' \
            http://127.0.0.1:18080/v2/config
          curl --fail --silent http://127.0.0.1:18080/metrics | \
            grep 'afc_web_http_requests_total'
          docker stop --time 20 "$name"
      - name: Run two-, three-, and four-browser battle/rematch acceptance
        shell: bash
        env:
          AFC_WEB_BASE_URL: http://127.0.0.1:8000
          AFC_WEB_SERVER_ORIGIN: http://127.0.0.1:18080
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/target/qa/web/ci"
          mkdir -p "$evidence"
          python3 -m http.server 8000 --directory web_dist \
            >"$evidence/static-server.log" 2>&1 &
          static_pid=$!
          name="afc-web-browser-ci-${GITHUB_RUN_ID}"
          active_clients="startup"
          cleanup() {
            docker logs "$name" \
              >"$evidence/server-${active_clients}-failure.log" 2>&1 || true
            docker rm --force "$name" >/dev/null 2>&1 || true
            kill "$static_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/ >/dev/null

          for clients in 2 3 4; do
            active_clients="$clients"
            docker run --detach --name "$name" \
              --read-only --tmpfs /tmp:size=16m,mode=1777 \
              --cap-drop ALL --security-opt no-new-privileges:true \
              --publish 127.0.0.1:18080:8080 \
              --env AFC_WEB_DEPLOYMENT=development \
              --env AFC_WEB_HTTP_BIND=0.0.0.0:8080 \
              --env AFC_WEB_ALLOWED_ORIGINS=http://127.0.0.1:8000 \
              --env AFC_WEB_PUBLIC_WEBSOCKET_URL=ws://127.0.0.1:18080/v2/connect/ws \
              --env AFC_WEB_SIGNING_KEY_ID=1 \
              --env AFC_WEB_SIGNING_KEY=AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE \
              afc-web-server:ci
            for _ in $(seq 1 30); do
              if curl --fail --silent http://127.0.0.1:18080/readyz >/dev/null; then
                break
              fi
              sleep 1
            done
            curl --fail --silent http://127.0.0.1:18080/readyz >/dev/null
            curl --fail --silent \
              --header 'Origin: http://127.0.0.1:8000' \
              http://127.0.0.1:18080/v2/config \
              >"$evidence/config-${clients}.json"
            AFC_QA_CLIENTS="$clients" \
              AFC_QA_OUTPUT_DIR="$evidence/playwright-${clients}" \
              npx playwright test --config tests/browser/playwright.config.mjs
            curl --fail --silent http://127.0.0.1:18080/metrics \
              >"$evidence/metrics-${clients}.txt"
            docker stop --time 20 "$name"
            docker logs "$name" >"$evidence/server-${clients}.log" 2>&1
            docker rm "$name"
            active_clients="between-runs"
          done
          trap - EXIT
          kill "$static_pid"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: afc-browser-multiplayer-qa-${{ github.run_id }}
          path: target/qa/web/ci/
          if-no-files-found: error
          retention-days: 30
